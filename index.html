 else{h+='<h3 style="margin:10px 0 2px">'+esc(name)+'</h3><div class="s">'+esc(user.email||'')+'</div>'+(me.bio?'<p style="margin:8px 0">'+esc(me.bio)+'</p>':'')+'<div class="row"><span class="tag">'+vs.length+' videos</span><span class="tag">'+st.f+' followers</span><span class="tag">'+st.v+' views</span><span class="tag'+(me.monetized?' g':'')+'">'+(me.monetized?'Monetized':'Not monetized')+'</span></div><div class="row"><button class="on" onclick="editOn(true)">Edit profile</button><button onclick="go(\'settings\')">Settings</button></div>'}
 h+='</div><h4 class="m" style="margin:0">My videos</h4>';
 vs.sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
 h+=vs.length?vs.map(v=>'<div class="mv"><span>'+esc(v.title)+'</span><button onclick="delVid(\''+v.id+'\')">Delete</button></div>').join(''):'<p class="m s">No videos yet. Tap Upload.</p>';
 a.innerHTML=h}

// ---- settings ----
window.savePay=async()=>{const d={easypaisa:$('ep').value.trim(),jazzcash:$('jc').value.trim(),bank:$('bk').value.trim(),title:$('bt').value.trim(),account:$('ba').value.trim()};
 try{await setDoc(doc(db,'users',user.uid,'private','payout'),d);alert('Saved')}catch(x){alert('Could not save payment details. Add the Firestore rule for private data first.')}};
window.monetize=async()=>{
 let n=0,p={};
 try{const q=await getDocs(query(collection(db,'videos'),where('uid','==',user.uid)));n=q.size}catch(x){}
 try{const q=await getDoc(doc(db,'users',user.uid,'private','payout'));if(q.exists())p=q.data()}catch(x){}
 if(n<3){alert('You need at least 3 videos of your own. You have '+n+'.');return}
 if(!(p.easypaisa||p.jazzcash||p.account)){alert('Save your payment details first.');return}
 try{await setDoc(doc(db,'users',user.uid),{monetized:true,monetizeRequestedAt:serverTimestamp()},{merge:true});me.monetized=true;go('settings')}catch(x){alert('Could not send request: '+(x.code||x))}};
async function settings(a){
 let p={};try{const s=await getDoc(doc(db,'users',user.uid,'private','payout'));if(s.exists())p=s.data()}catch(x){}
 const f=(id,l,v,ph)=>'<label class="s">'+l+'</label><input id="'+id+'" value="'+esc(v||'')+'" placeholder="'+(ph||'')+'" style="'+IN+'">';
 await loadOwner();
 try{const mm=await getDoc(doc(db,'users',user.uid));if(mm.exists())me=mm.data()}catch(x){}
 const st=await stats2(user.uid);
 const mon='<div class="card"><h4>Monetization</h4>'+(me.monetized?'<span class="tag g">Monetized</span><p class="s">Your channel earns 60% of ad money on your videos. Tube keeps 40%.</p>':(me.monetizeRequest?'<span class="tag">Waiting for owner approval</span><p class="s">The owner will review your request.</p>':'<p class="s">You can ask for monetization at '+FMIN+' followers and '+VMIN+' views. You have '+st.f+' followers and '+st.v+' views. Until the owner approves your channel, ad earnings from your videos belong to Tube. After approval you earn 60% and Tube keeps 40%.</p>'+((st.f>=FMIN&&st.v>=VMIN)?'<button class="on" onclick="monetize()">Request monetization</button>':'<button disabled style="opacity:.5">Not eligible yet</button>')))+'</div>';
 const extra=(owner==='none'?'<div class="card"><h4>Owner</h4><p class="s">No owner is set yet. The first person to tap this becomes the Tube owner. Tap it now if you are the owner.</p><button class="on" onclick="claim()">I am the owner</button></div>':'')
 +(isOwner()?'<div class="card"><h4>Owner</h4><button class="on" onclick="go(\'owner\')">Open owner panel</button></div><div class="card"><h4>Add free movie (owner)</h4>'+f('mt','Title')+f('mu','YouTube link, archive.org page link or direct https .mp4 link')+f('ml','License (e.g. Public Domain)')+'<select id="mc" style="'+IN+'"><option value="movie">Free movie (public domain / open license)</option><option value="cartoon">Cartoon (open license)</option><option value="pkdrama">Pakistani drama</option><option value="pkmovie">Pakistani movie</option><option value="pksong">Pakistani song</option><option value="inmovie">Indian movie</option><option value="insong">Indian song</option></select><button class="on" onclick="addMv()">Add</button><p class="s">For dramas, films and songs paste the link of the official YouTube video of its owner. It plays in the YouTube player. If it shows an error, the owner has switched embedding off, so pick another.</p></div>':'');
 a.innerHTML='<div class="m"><button onclick="go(\'me\')">← Back</button><h3>Settings</h3></div>'
 +'<div class="card"><h4>Language</h4><div id="gtslot"></div><p class="s">Choose any language. Tube translates itself.</p></div>'
 +'<div class="card"><h4>Payment details</h4>'+f('ep','Easypaisa number',p.easypaisa,'03XX XXXXXXX')+f('jc','JazzCash number',p.jazzcash,'03XX XXXXXXX')+f('bk','Bank name (e.g. Meezan Bank)',p.bank)+f('bt','Account title',p.title)+f('ba','Account number / IBAN',p.account)+'<button class="on" onclick="savePay()">Save payment details</button></div>'
 +mon
 +extra+'<div class="card"><h4>App</h4><div class="row"><button onclick="install()">Install Tube</button><button onclick="go(\'terms\')">Rules</button><button onclick="logout()">Sign out</button></div></div>';
 const g=$('gt');$('gtslot').appendChild(g);g.style.display='block'}


// ---- reports, movies, rules ----
window.rep=async id=>{if(!confirm('Report this video for copied, adult, violent or misleading content?'))return;
 try{await addDoc(collection(db,'reports'),{video:id,by:user.uid,createdAt:serverTimestamp()});alert('Thanks. We will review it.')}catch(x){alert('Could not send report: '+(x.code||x))}};
let owner=null,mvTab='movie';
async function loadOwner(){try{const q=await getDoc(doc(db,'config','owner'));owner=q.exists()?q.data().uid:'none'}catch(e){owner=null}}
const isOwner=()=>owner&&owner!=='none'&&owner==user.uid;
window.mvSet=k=>{mvTab=k;go('mv')};
window.claim=async()=>{try{await setDoc(doc(db,'config','owner'),{uid:user.uid});alert('You are now the Tube owner.');go('settings')}catch(x){alert('Could not set owner. Add the new Firestore rules first. '+(x.code||''))}};
window.addMv=async()=>{const t=$('mt').value.trim(),u0=$('mu').value.trim(),l=$('ml').value.trim()||'Free to watch',c=$('mc').value;
 if(!t||!u0){alert('Enter a title and a link');return}
 let type='mp4',u=u0;const yt=ytId(u0),ia=u0.match(/archive\.org\/(?:details|embed)\/([^\/?#\s]+)/);
 if(yt){type='yt';u=yt}else if(ia){type='ia';u=ia[1]}else if(!/^https:\/\//.test(u0)){alert('The link must start with https://');return}
 try{await addDoc(collection(db,'movies'),{t,u,c,l,type,createdAt:serverTimestamp()});alert('Added');mvTab=c;go('mv')}catch(x){alert('Could not add: '+(x.code||x))}};
window.delMv=async id=>{if(!confirm('Delete this?'))return;try{await deleteDoc(doc(db,'movies',id));go('mv')}catch(x){alert('Could not delete: '+(x.code||x))}};
const TABS=[['movie','Free movies'],['cartoon','Cartoons'],['pkdrama','PK Dramas'],['pkmovie','PK Movies'],['pksong','PK Songs'],['inmovie','India Movies'],['insong','India Songs']];
function ytId(u){const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);return m?m[1]:null}
const player=m=>m.type=='yt'?'<iframe src="https://www.youtube.com/embed/'+esc(m.u)+'?rel=0" style="width:100%;aspect-ratio:16/9;border:0" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>':m.type=='ia'?'<iframe src="https://archive.org/embed/'+esc(m.u)+'" style="width:100%;height:240px;border:0" allowfullscreen></iframe>':'<video src="'+esc(m.u)+'" controls playsinline preload="metadata"></video>';
async function movies(a){
 await loadOwner();
 let list=[];
 try{const q=await getDocs(query(collection(db,'movies'),limit(100)));q.forEach(d=>list.push({id:d.id,...d.data()}))}catch(x){}
 const L=list.filter(m=>m.c==mvTab),own=mvTab=='movie'||mvTab=='cartoon';
 let h='<div class="chips">'+TABS.map(t=>'<button class="'+(mvTab==t[0]?'on':'')+'" onclick="mvSet(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>';
 h+=L.length?L.map((m,i)=>'<div>'+player(m)+'<div class="m"><b>'+esc(m.t)+'</b><div class="s">'+(m.type=='yt'?'Played from YouTube. The video owner keeps the views and earnings. ':'')+esc(m.l||'')+'</div>'+(isOwner()?'<button class="rp" onclick="delMv(\''+m.id+'\')">Delete</button>':'')+'</div></div>'+((i+1)%2==0&&own?'<div class="ad">Ad space: paste your AdSense code here</div>':'')).join(''):'<p class="m">Nothing here yet.'+(isOwner()?' Add one from Settings.':'')+'</p>';
 a.innerHTML=h}
function terms(a){
 a.innerHTML='<div class="m"><button onclick="go(\'settings\')">← Back</button><h3>Tube rules</h3>'
 +'<p><b>Uploading</b></p><p class="s">Upload only videos you made yourself. Do not upload videos made by others, videos with other apps\' watermarks, or movies and cartoons you do not own. Adult, violent, hateful, misleading and unsafe content for children is not allowed. Videos can be up to 35 minutes and 100 MB.</p>'
 +'<p><b>Reports and removal</b></p><p class="s">Anyone can report a video. Videos that break these rules are removed. Repeated breaking of the rules turns off monetization for the channel.</p>'
 +'<p><b>Earning</b></p><p class="s">A channel can ask for monetization after 3,000 followers and 10,000 views, and the Tube owner approves requests. Until a channel is approved, ad earnings from its videos belong to Tube. After approval the creator earns 60% of ad money on their videos and Tube keeps 40%. Fake views or clicking ads yourself means earnings are cancelled. Minimum withdrawal is Rs 1,000.</p>'
 +'<p><b>Free movies and cartoons</b></p><p class="s">Free movies and cartoons are public domain or open license, with the license written under each title. Dramas, films and songs from YouTube play in the YouTube player. Their owners keep the views and earnings, and Tube does not copy or host them.</p>'
 +'<p><b>Privacy</b></p><p class="s">Your payment details are visible only to you and the Tube owner. Ads shown in Tube may use cookies.</p></div>'}


// ---- likes, views, comments, share ----
const seen=new Set();
const vidHtml=(id,v)=>'<div id="v'+id+'"><video src="'+esc(v.url)+'" controls playsinline preload="metadata" onplay="viewed(\''+id+'\')"></video><div class="m"><b>'+esc(v.title)+'</b><div class="s">'+esc(v.name)+'<span id="vw'+id+'"></span></div><div class="row"><button id="lk'+id+'" data-n="0" data-on="0" onclick="like(\''+id+'\')">Like</button><button onclick="cm(\''+id+'\')">Comments</button><button onclick="shr(\''+id+'\')">Share</button><button class="rp" onclick="rep(\''+id+'\')">Report</button>'+(v.uid&&v.uid!=user.uid?'<button class="rp fol" data-u="'+esc(v.uid)+'" data-on="0" onclick="follow(\''+esc(v.uid)+'\')">Follow</button>':'')+'</div><div id="cm'+id+'" hidden></div></div></div>';
function paintLike(id){const b=$('lk'+id);if(!b)return;const on=b.dataset.on=='1';b.textContent=(on?'Liked ':'Like ')+(b.dataset.n||0);b.className=on?'on':''}
function stats(ids){ids.forEach(async id=>{try{
 const [l,w,m]=await Promise.all([getCountFromServer(collection(db,'videos',id,'likes')),getCountFromServer(collection(db,'videos',id,'views')),getDoc(doc(db,'videos',id,'likes',user.uid))]);
 const b=$('lk'+id);if(b){b.dataset.n=l.data().count;b.dataset.on=m.exists()?1:0;paintLike(id)}
 const w2=$('vw'+id);if(w2)w2.textContent=' - '+w.data().count+' views';
 const fb=document.querySelector('#v'+id+' .fol');if(fb){const fs=await getDoc(doc(db,'users',fb.dataset.u,'followers',user.uid));if(fs.exists()){fb.dataset.on='1';fb.textContent='Following'}}}catch(e){}})}
window.viewed=async id=>{if(seen.has(id))return;seen.add(id);try{await setDoc(doc(db,'videos',id,'views',user.uid),{at:serverTimestamp()})}catch(e){}};
window.like=async id=>{const b=$('lk'+id);let n=+b.dataset.n||0;const on=b.dataset.on=='1',r=doc(db,'videos',id,'likes',user.uid);
 try{if(on){await deleteDoc(r);n--}else{await setDoc(r,{at:serverTimestamp()});n++}b.dataset.n=n;b.dataset.on=on?0:1;paintLike(id)}catch(x){alert('Could not like: '+(x.code||x))}};
window.shr=async id=>{const u=location.origin+location.pathname+'?v='+id;try{if(navigator.share)await navigator.share({title:'Tube',url:u});else{await navigator.clipboard.writeText(u);alert('Link copied')}}catch(e){}};
async function loadCm(id){const p=$('cm'+id);
 let h='<div class="row"><input id="ci'+id+'" maxlength="300" placeholder="Write a comment" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:10px;font:inherit"><button class="on" onclick="postCm(\''+id+'\')">Post</button></div>';
 try{const q=await getDocs(query(collection(db,'videos',id,'comments'),orderBy('createdAt','desc'),limit(30)));
  q.forEach(d=>{const c=d.data();h+='<div class="mv"><span><b>'+esc(c.name)+'</b> '+esc(c.text)+'</span>'+(c.uid==user.uid?'<button class="rp" onclick="delCm(\''+id+'\',\''+d.id+'\')">Delete</button>':'')+'</div>'});
  if(q.empty)h+='<p class="s">No comments yet.</p>'}catch(x){h+='<p class="s">Could not load comments.</p>'}
 p.innerHTML=h}
window.cm=async id=>{const p=$('cm'+id);if(!p.hidden){p.hidden=true;return}p.hidden=false;p.innerHTML='<p class="s">Loading…</p>';await loadCm(id)};
window.postCm=async id=>{const t=$('ci'+id).value.trim();if(!t)return;
 try{await addDoc(collection(db,'videos',id,'comments'),{uid:user.uid,name:me.name||nm(user),text:t.slice(0,300),createdAt:serverTimestamp()});await loadCm(id)}catch(x){alert('Could not post: '+(x.code||x))}};
window.delCm=async(id,c)=>{try{await deleteDoc(doc(db,'videos',id,'comments',c));await loadCm(id)}catch(x){alert('Could not delete: '+(x.code||x))}};


// ---- follow, stats, monetization, owner panel ----
const FMIN=3000,VMIN=10000;
window.follow=async u=>{const bs=[...document.querySelectorAll('.fol[data-u="'+u+'"]')];const on=bs[0]&&bs[0].dataset.on=='1',r=doc(db,'users',u,'followers',user.uid);
 try{if(on)await deleteDoc(r);else await setDoc(r,{at:serverTimestamp()});bs.forEach(b=>{b.dataset.on=on?0:1;b.textContent=on?'Follow':'Following'})}catch(x){alert('Could not follow: '+(x.code||x))}};
async function stats2(uid){let f=0,v=0,n=0;
 try{const q=await getDocs(query(collection(db,'videos'),where('uid','==',uid)));n=q.size;const c=await Promise.all(q.docs.map(d=>getCountFromServer(collection(db,'videos',d.id,'views'))));v=c.reduce((a,x)=>a+x.data().count,0)}catch(e){}
 try{f=(await getCountFromServer(collection(db,'users',uid,'followers'))).data().count}catch(e){}
 return{f,v,n}}
window.monetize=async()=>{const st=await stats2(user.uid);
 if(st.f<FMIN||st.v<VMIN){alert('You need '+FMIN+' followers and '+VMIN+' views. You have '+st.f+' followers and '+st.v+' views.');return}
 let p={};try{const q=await getDoc(doc(db,'users',user.uid,'private','payout'));if(q.exists())p=q.data()}catch(x){}
 if(!(p.easypaisa||p.jazzcash||p.account)){alert('Save your payment details first.');return}
 try{await setDoc(doc(db,'users',user.uid),{monetizeRequest:true,monetizeRequestedAt:serverTimestamp()},{merge:true});me.monetizeRequest=true;alert('Request sent to the owner.');go('settings')}catch(x){alert('Could not send request: '+(x.code||x))}};
window.mzSet=async(id,on)=>{if(!confirm(on?'Approve monetization for this channel?':'Reject or stop monetization for this channel?'))return;
 try{await setDoc(doc(db,'users',id),on?{monetized:true,monetizeRequest:false,monetizedAt:serverTimestamp()}:{monetized:false,monetizeRequest:false},{merge:true});go('owner')}catch(x){alert('Could not save: '+(x.code||x))}};
window.ovDel=async(vid,rid)=>{if(!confirm('Delete this video?'))return;
 try{await deleteDoc(doc(db,'videos',vid));if(rid)await deleteDoc(doc(db,'reports',rid));go('owner')}catch(x){alert('Could not delete: '+(x.code||x))}};
window.rpDismiss=async rid=>{try{await deleteDoc(doc(db,'reports',rid));go('owner')}catch(x){alert('Could not dismiss: '+(x.code||x))}};
async function ownerPanel(a){
 await loadOwner();if(!isOwner()){a.innerHTML='<p class="m">Owner only.</p>';return}
 a.innerHTML='<p class="m s">Loading…</p>';
 let h='<div class="m"><button onclick="go(\'settings\')">← Back</button><h3>Owner panel</h3></div>',uc=0,vc=0;
 try{uc=(await getCountFromServer(collection(db,'users'))).data().count;vc=(await getCountFromServer(collection(db,'videos'))).data().count}catch(e){}
 h+='<div class="card"><h4>Overview</h4><div class="row"><span class="tag">'+uc+' users</span><span class="tag">'+vc+' videos</span></div></div>';
 let rq=[],mz=[];
 try{const q=await getDocs(query(collection(db,'users'),where('monetizeRequest','==',true)));q.forEach(d=>rq.push({id:d.id,...d.data()}))}catch(e){}
 try{const q=await getDocs(query(collection(db,'users'),where('monetized','==',true)));q.forEach(d=>mz.push({id:d.id,...d.data()}))}catch(e){}
 const rs=await Promise.all(rq.map(r=>stats2(r.id)));
 h+='<div class="card"><h4>Monetization requests ('+rq.length+')</h4>'+(rq.length?rq.map((r,i)=>'<div class="mv"><span>'+esc(r.name||'User')+'<br><span class="s">'+rs[i].f+' followers, '+rs[i].v+' views</span></span><span><button class="on" onclick="mzSet(\''+r.id+'\',true)">Approve</button> <button onclick="mzSet(\''+r.id+'\',false)">Reject</button></span></div>').join(''):'<p class="s">No requests.</p>')+'</div>';
 h+='<div class="card"><h4>Monetized channels ('+mz.length+')</h4>'+(mz.length?mz.map(r=>'<div class="mv"><span>'+esc(r.name||'User')+'</span><button onclick="mzSet(\''+r.id+'\',false)">Stop</button></div>').join(''):'<p class="s">None yet.</p>')+'</div>';
 let rp=[];try{const q=await getDocs(query(collection(db,'reports'),limit(30)));q.forEach(d=>rp.push({id:d.id,...d.data()}))}catch(e){}
 const rv=await Promise.all(rp.map(r=>getDoc(doc(db,'videos',r.video)).catch(()=>null)));
 h+='<div class="card"><h4>Reports ('+rp.length+')</h4>'+(rp.length?rp.map((r,i)=>{const ok=rv[i]&&rv[i].exists();return '<div class="mv"><span>'+(ok?esc(rv[i].data().title):'Video already removed')+'</span><span>'+(ok?'<button class="on" onclick="ovDel(\''+r.video+'\',\''+r.id+'\')">Delete video</button> ':'')+'<button onclick="rpDismiss(\''+r.id+'\')">Dismiss</button></span></div>'}).join(''):'<p class="s">No reports.</p>')+'</div>';
 let vl=[];try{const q=await getDocs(query(collection(db,'videos'),orderBy('createdAt','desc'),limit(20)));q.forEach(d=>vl.push({id:d.id,...d.data()}))}catch(e){}
 h+='<div class="card"><h4>Latest videos</h4>'+(vl.length?vl.map(v=>'<div class="mv"><span>'+esc(v.title)+'<br><span class="s">'+esc(v.name)+'</span></span><button onclick="ovDel(\''+v.id+'\',\'\')">Delete</button></div>').join(''):'<p class="s">No videos.</p>')+'</div>';
 a.innerHTML=h}

window.go=async t=>{
 const a=$('app'),g=$('gt');if(g.parentNode!==document.body){g.style.display='none';document.body.appendChild(g)}
 if(!user){a.innerHTML=authView();return}
 if(t=='up'){$('file').click();return}
 if(t!='me')edit=false;
 if(t=='home'){
  a.innerHTML='<p class="m s">Loading…</p>';
  const qv=new URLSearchParams(location.search).get('v');
  const s=await getDocs(query(collection(db,'videos'),orderBy('createdAt','desc'),limit(30)));let h='',i=0,ids=[];
  if(qv){try{const one=await getDoc(doc(db,'videos',qv));if(one.exists()){h+=vidHtml(one.id,one.data());ids.push(one.id)}}catch(e){}}
  s.forEach(d=>{if(d.id==qv)return;h+=vidHtml(d.id,d.data());ids.push(d.id);if(++i%3==0)h+='<div class="ad">Ad space: paste your AdSense or AdMob code here</div>'});
  a.innerHTML=h||'<p class="m">No videos yet. Tap Upload.</p>';stats(ids);return}
 if(t=='fr'){
  const s=await getDocs(query(collection(db,'users'),limit(50)));let h='<h3 class="m">People</h3>';
  s.forEach(d=>{if(d.id==user.uid)return;h+='<div class="fr"><span>'+esc(d.data().name||'User')+'</span><button class="on" onclick="addFr(\''+d.id+'\',this)">Add friend</button></div>'});
  a.innerHTML=h;return}
 if(t=='settings'){await settings(a);return}
 if(t=='mv'){await movies(a);return}
 if(t=='terms'){terms(a);return}
 if(t=='owner'){await ownerPanel(a);return}
 await profile(a)};
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const v=document.createElement('video');v.preload='metadata';
 v.onloadedmetadata=()=>{if(f.size>MAXB)alert('Video is bigger than 100 MB. Choose a smaller one.');else if(v.duration>MAX)alert('Video is longer than 35 minutes');else if(confirm('Upload only your own video. No copied, adult, violent or misleading content. Tap OK to agree to the Tube rules.'))send(f)};v.src=URL.createObjectURL(f)};
function send(f){
 const def=f.name.replace(/\.[^.]+$/,''),title=(prompt('Video title',def)||def).trim().slice(0,100)||def;
 const x=new XMLHttpRequest(),d=new FormData();
 d.append('file',f);d.append('upload_preset','tube_videos');
 x.open('POST','https://api.cloudinary.com/v1_1/qpaa2pyv/video/upload');
 x.upload.onprogress=e=>{if(e.lengthComputable)$('app').innerHTML='<p class="m">Uploading '+Math.round(e.loaded/e.total*100)+'%</p>'};
 x.onerror=()=>alert('Upload failed. Check your internet.');
 x.onload=async()=>{let r={};try{r=JSON.parse(x.responseText)}catch(e){}
  if(!r.secure_url){alert('Upload failed: '+((r.error&&r.error.message)||x.status));go('home');return}
  await addDoc(collection(db,'videos'),{title,url:r.secure_url,uid:user.uid,name:me.name||nm(user),createdAt:serverTimestamp()});go('home')};
 x.send(d)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
